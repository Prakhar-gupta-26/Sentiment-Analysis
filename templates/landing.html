<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Amazon Alexa Reviews Analysis</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/creativetimofficial/tailwind-starter-kit/compiled-tailwind.min.css">
  <style>
    .result-image { max-width: 100%; height: auto; }
    #statusMessage { min-height: 1.5rem; }
  </style>
</head>
<body class="text-gray-800 antialiased">
  <main>
    <section class="relative pt-16 pb-32 flex items-center justify-center"
             style="min-height: 45vh; background: linear-gradient(90deg, rgba(17,223,169,1), rgba(3,60,88,1) 49%, rgba(10,32,50,1));">
      <div class="container relative mx-auto px-4 text-center">
        <h1 class="text-white font-semibold text-5xl">Understand the emotions behind the words. 😊</h1>
        <p class="mt-4 text-lg text-gray-200">
          Analyze the emotions and opinions expressed in your text data.
        </p>
      </div>
    </section>

    <section class="relative py-16">
      <div class="text-center">
        <h1 class="text-4xl font-semibold py-2">Text Sentiment Prediction</h1>
      </div>

      <div class="container mx-auto px-4 py-12">
        <div class="flex flex-wrap items-start">
          <div class="w-full md:w-5/12 mx-auto px-4">
            <div class="max-w-lg mx-auto">
              <label class="block text-sm text-gray-700 mb-1" for="csvFileInput">Upload your CSV file (optional)</label>
              <input type="file" id="csvFileInput" accept=".csv"
                class="block px-3 py-2 rounded-lg w-full bg-white border-2 border-gray-300 shadow-md">

              <label class="block text-sm text-gray-700 mt-4 mb-1" for="textInput">Text for Prediction</label>
              <textarea id="textInput" rows="4" placeholder="Enter an Amazon Alexa review..."
                class="block px-3 py-2 rounded-lg w-full bg-white border-2 border-gray-300 shadow-md"></textarea>

              <button id="predictBtn" type="button" onclick="predict()"
                class="mt-4 text-lg font-semibold bg-gray-800 w-full text-white rounded-lg px-6 py-3 shadow-xl hover:bg-black">
                Predict
              </button>
              <p id="statusMessage" class="mt-3 text-sm" role="status"></p>
            </div>
          </div>

          <div class="w-full md:w-5/12 mx-auto px-4 mt-10 md:mt-0">
            <h2 class="text-3xl underline">Prediction Result</h2>
            <div class="p-4 m-2 border rounded" id="predictionResult" aria-live="polite"></div>

            <div class="pt-6">
              <h2 class="text-3xl underline">Graph Result</h2>
              <div class="p-4 m-2 border rounded" id="graphContainer"></div>
            </div>

            <button id="downloadBtn" type="button" hidden
              class="mt-6 text-lg font-semibold bg-gray-800 w-full text-white rounded-lg px-6 py-3 shadow-xl hover:bg-black">
              Download Predictions
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-gray-900 pt-8 pb-6">
    <div class="container mx-auto px-4 text-center">
      <hr class="my-6 border-gray-400">
      <p class="text-sm text-white font-semibold py-1">Copyright © Text sentiment prediction</p>
    </div>
  </footer>

<script>
  let predictionsBlob = null;

  async function predict() {
    const csvInput = document.getElementById("csvFileInput");
    const textInput = document.getElementById("textInput");
    const result = document.getElementById("predictionResult");
    const graph = document.getElementById("graphContainer");
    const status = document.getElementById("statusMessage");
    const button = document.getElementById("predictBtn");
    const downloadBtn = document.getElementById("downloadBtn");

    result.textContent = "";
    graph.replaceChildren();
    downloadBtn.hidden = true;
    predictionsBlob = null;

    button.disabled = true;
    button.textContent = "Predicting...";
    status.textContent = "Please wait...";
    status.className = "mt-3 text-sm text-gray-600";

    try {
      let response;

      if (csvInput.files.length > 0) {
        const formData = new FormData();
        formData.append("file", csvInput.files[0]);

        // Use a relative URL so the browser sends the request to this same
        // host (127.0.0.1), avoiding localhost/127.0.0.1 CORS problems.
        response = await fetch("/predict", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error || "CSV prediction failed.");
        }

        const graphData = response.headers.get("X-Graph-Data");
        if (graphData) {
          const image = document.createElement("img");
          image.src = "data:image/png;base64," + graphData;
          image.alt = "Sentiment distribution graph";
          image.className = "result-image";
          graph.appendChild(image);
        }

        predictionsBlob = await response.blob();
        downloadBtn.hidden = false;
        status.textContent = "Bulk prediction completed successfully.";
        status.className = "mt-3 text-sm text-green-700";
      } else {
        const review = textInput.value.trim();
        if (!review) {
          throw new Error("Please enter a review or choose a CSV file.");
        }

        response = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: review })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Prediction failed.");
        }

        result.textContent = "Predicted sentiment: " + data.prediction;
        result.className = data.prediction === "Positive"
          ? "p-4 m-2 border rounded text-green-700 font-semibold"
          : "p-4 m-2 border rounded text-red-700 font-semibold";
        status.textContent = "Prediction completed successfully.";
        status.className = "mt-3 text-sm text-green-700";
      }
    } catch (error) {
      status.textContent = error.message;
      status.className = "mt-3 text-sm text-red-700";
      console.error("Prediction error:", error);
    } finally {
      button.disabled = false;
      button.textContent = "Predict";
    }
  }

  document.getElementById("downloadBtn").addEventListener("click", function () {
    if (!predictionsBlob) return;
    const url = URL.createObjectURL(predictionsBlob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "Predictions.csv";
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
